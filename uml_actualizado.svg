<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .titulo { font-family: Helvetica, Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #0F172A; }
      .subtitulo { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .clase-box { fill: #FFFFFF; stroke: #0F766E; stroke-width: 2; rx: 6; }
      .clase-gui { fill: #FFFFFF; stroke: #1E3A8A; stroke-width: 2; rx: 6; }
      .clase-exc { fill: #FEF2F2; stroke: #B91C1C; stroke-width: 2; rx: 6; }
      .header-negocio { fill: #0F766E; }
      .header-gui { fill: #1E3A8A; }
      .header-exc { fill: #B91C1C; }
      .clase-nombre { font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .estereotipo { font-family: Helvetica, Arial, sans-serif; font-size: 10px; fill: #CCFBF1; text-anchor: middle; }
      .item { font-family: Consolas, Menlo, monospace; font-size: 11px; fill: #1E293B; }
      .sep { stroke: #CBD5E1; stroke-width: 1.2; }
      .linea-herencia { stroke: #0F172A; stroke-width: 1.8; fill: none; }
      .linea-asoc { stroke: #334155; stroke-width: 1.6; fill: none; }
      .linea-dep { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; }
      .cardinalidad { font-family: Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #334155; }
    </style>
    <marker id="trianguloHerencia" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    </marker>
    <marker id="diamanteAgregacion" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="flechaUso" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#64748B" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="1010"/>
  <text x="30" y="34" class="titulo">Diagrama de Clases UML Actualizado — SGRT (Parte 3: GUI, BD SQLite y Validaciones)</text>
  <text x="30" y="54" class="subtitulo">Incluye módulos modelos.py, persistencia.py e interfaz.py | Nomenclatura camelCase y encapsulamiento (_)</text>

  <!-- PERSONA -->
  <g transform="translate(55, 75)">
    <rect class="clase-box" width="300" height="135"/>
    <rect class="header-negocio" width="300" height="30" rx="4"/>
    <text x="150" y="20" class="clase-nombre">Persona</text>
    <text x="12" y="48" class="item">- _nombre: str</text>
    <text x="12" y="64" class="item">- _telefono: str</text>
    <line class="sep" x1="0" y1="74" x2="300" y2="74"/>
    <text x="12" y="92" class="item">+ nombre / telefono (@property)</text>
    <text x="12" y="108" class="item">+ toDict(): dict</text>
    <text x="12" y="124" class="item">+ __str__(): str</text>
  </g>

  <!-- CLIENTE -->
  <g transform="translate(20, 275)">
    <rect class="clase-box" width="190" height="115"/>
    <rect class="header-negocio" width="190" height="28" rx="4"/>
    <text x="95" y="19" class="clase-nombre">Cliente</text>
    <text x="10" y="46" class="item">- _direccion: str</text>
    <line class="sep" x1="0" y1="56" x2="190" y2="56"/>
    <text x="10" y="74" class="item">+ direccion (@property)</text>
    <text x="10" y="90" class="item">+ toDict(): dict</text>
    <text x="10" y="106" class="item">+ __str__(): str</text>
  </g>

  <!-- TECNICO -->
  <g transform="translate(225, 275)">
    <rect class="clase-box" width="200" height="115"/>
    <rect class="header-negocio" width="200" height="28" rx="4"/>
    <text x="100" y="19" class="clase-nombre">Tecnico</text>
    <text x="10" y="46" class="item">- _especialidad: str</text>
    <line class="sep" x1="0" y1="56" x2="200" y2="56"/>
    <text x="10" y="74" class="item">+ especialidad (@property)</text>
    <text x="10" y="90" class="item">+ toDict(): dict</text>
    <text x="10" y="106" class="item">+ __str__(): str</text>
  </g>

  <!-- Herencia Persona -->
  <polyline class="linea-herencia" points="115,275 115,240 205,240 205,210" marker-end="url(#trianguloHerencia)"/>
  <polyline class="linea-herencia" points="325,275 325,240 205,240"/>

  <!-- DISPOSITIVO -->
  <g transform="translate(465, 75)">
    <rect class="clase-box" width="330" height="150"/>
    <rect class="header-negocio" width="330" height="30" rx="4"/>
    <text x="165" y="20" class="clase-nombre">Dispositivo</text>
    <text x="12" y="48" class="item">- _marca: str</text>
    <text x="12" y="64" class="item">- _modelo: str</text>
    <text x="12" y="80" class="item">- _fallaReportada: str</text>
    <line class="sep" x1="0" y1="90" x2="330" y2="90"/>
    <text x="12" y="108" class="item">+ marca / modelo / fallaReportada</text>
    <text x="12" y="124" class="item">+ toDict(): dict</text>
    <text x="12" y="140" class="item">+ __str__(): str</text>
  </g>

  <!-- COMPUTADORA -->
  <g transform="translate(445, 275)">
    <rect class="clase-box" width="180" height="115"/>
    <rect class="header-negocio" width="180" height="28" rx="4"/>
    <text x="90" y="19" class="clase-nombre">Computadora</text>
    <text x="10" y="46" class="item">- _ram: int</text>
    <line class="sep" x1="0" y1="56" x2="180" y2="56"/>
    <text x="10" y="74" class="item">+ ram (@property)</text>
    <text x="10" y="90" class="item">+ toDict(): dict</text>
    <text x="10" y="106" class="item">+ __str__(): str</text>
  </g>

  <!-- DISPOSITIVO MOVIL -->
  <g transform="translate(640, 275)">
    <rect class="clase-box" width="180" height="115"/>
    <rect class="header-negocio" width="180" height="28" rx="4"/>
    <text x="90" y="19" class="clase-nombre">DispositivoMovil</text>
    <text x="10" y="46" class="item">- _imei: str</text>
    <line class="sep" x1="0" y1="56" x2="180" y2="56"/>
    <text x="10" y="74" class="item">+ imei (@property)</text>
    <text x="10" y="90" class="item">+ toDict(): dict</text>
    <text x="10" y="106" class="item">+ __str__(): str</text>
  </g>

  <!-- Herencia Dispositivo -->
  <polyline class="linea-herencia" points="535,275 535,250 630,250 630,225" marker-end="url(#trianguloHerencia)"/>
  <polyline class="linea-herencia" points="730,275 730,250 630,250"/>

  <!-- ORDEN SERVICIO -->
  <g transform="translate(860, 75)">
    <rect class="clase-box" width="510" height="285"/>
    <rect class="header-negocio" width="510" height="30" rx="4"/>
    <text x="255" y="20" class="clase-nombre">OrdenServicio</text>
    <text x="12" y="48" class="item">- _folio: str | _estado: str</text>
    <text x="12" y="64" class="item">- _cliente: Cliente | _tecnico: Tecnico</text>
    <text x="12" y="80" class="item">- _dispositivo: Dispositivo</text>
    <text x="12" y="96" class="item">- _costoManoObra: float | _costoRepuestos: float</text>
    <text x="12" y="112" class="item">- _descuento: float | _costoTotal: float</text>
    <line class="sep" x1="0" y1="122" x2="510" y2="122"/>
    <text x="12" y="140" class="item">+ folio / cliente / tecnico / dispositivo / estado</text>
    <text x="12" y="156" class="item">+ costoManoObra / costoRepuestos / descuento / costoTotal</text>
    <text x="12" y="172" class="item">+ calcularSubtotal(): float</text>
    <text x="12" y="188" class="item">+ calcularCostoTotal(): float</text>
    <text x="12" y="204" class="item">+ calcularIva(tasa=0.16): float</text>
    <text x="12" y="220" class="item">+ toDict(): dict</text>
    <text x="12" y="236" class="item">+ desdeDict(dato: dict): OrdenServicio (classmethod)</text>
    <text x="12" y="252" class="item">+ __str__(): str</text>
  </g>

  <!-- Agregación OrdenServicio -> Dispositivo y Personas -->
  <line class="linea-asoc" x1="860" y1="145" x2="795" y2="145" marker-start="url(#diamanteAgregacion)"/>
  <text x="802" y="138" class="cardinalidad">1</text>
  <polyline class="linea-asoc" points="860,210 835,210 835,332 425,332" marker-start="url(#diamanteAgregacion)"/>
  <line class="linea-asoc" x1="210" y1="332" x2="225" y2="332"/>

  <!-- EXCEPCIONES -->
  <g transform="translate(20, 440)">
    <rect class="clase-exc" width="380" height="145"/>
    <rect class="header-exc" width="380" height="36" rx="4"/>
    <text x="190" y="16" class="estereotipo">&lt;&lt;excepciones personalizadas&gt;&gt;</text>
    <text x="190" y="30" class="clase-nombre">Excepciones SGRT</text>
    <text x="12" y="58" class="item">+ ValorFueraDeRangoError(ValueError)</text>
    <text x="12" y="76" class="item">+ RegistroDuplicadoError(ValueError)</text>
    <text x="12" y="94" class="item">+ RegistroNoEncontradoError(LookupError)</text>
    <line class="sep" x1="0" y1="106" x2="380" y2="106"/>
    <text x="12" y="126" class="item">+ registrarError(mensaje, rutaArchivoLog)</text>
  </g>

  <!-- GESTOR ARCHIVOS -->
  <g transform="translate(425, 440)">
    <rect class="clase-box" width="395" height="145"/>
    <rect class="header-negocio" width="395" height="36" rx="4"/>
    <text x="197" y="16" class="estereotipo">&lt;&lt;persistencia.py&gt;&gt;</text>
    <text x="197" y="30" class="clase-nombre">GestorArchivos</text>
    <text x="12" y="58" class="item">+ rutaDatos: Path (ordenes_datos.txt)</text>
    <text x="12" y="76" class="item">+ rutaLog: Path (log_errores.txt)</text>
    <line class="sep" x1="0" y1="88" x2="395" y2="88"/>
    <text x="12" y="108" class="item">+ guardarOrdenes(listaDiccionarios) (@static)</text>
    <text x="12" y="126" class="item">+ cargarDatosPreconstruidos(): list (@static)</text>
  </g>

  <!-- GESTOR BASE DE DATOS -->
  <g transform="translate(860, 415)">
    <rect class="clase-box" width="510" height="235"/>
    <rect class="header-negocio" width="510" height="36" rx="4"/>
    <text x="255" y="16" class="estereotipo">&lt;&lt;persistencia.py — SQLite&gt;&gt;</text>
    <text x="255" y="30" class="clase-nombre">GestorBaseDatos</text>
    <text x="12" y="58" class="item">- _rutaBd: Path (catalogos_sgrt.db)</text>
    <text x="12" y="74" class="item">- _rutaTxt: Path (ordenes_datos.txt)</text>
    <line class="sep" x1="0" y1="84" x2="510" y2="84"/>
    <text x="12" y="102" class="item">+ inicializarTablas() / cargarCatalogosIniciales()</text>
    <text x="12" y="120" class="item">+ registrarCliente() / obtenerClientes() / modificarCliente()</text>
    <text x="12" y="138" class="item">+ eliminarCliente(idCliente)</text>
    <text x="12" y="156" class="item">+ registrarTecnico() / obtenerTecnicos() / modificarTecnico()</text>
    <text x="12" y="174" class="item">+ eliminarTecnico(idTecnico)</text>
    <text x="12" y="192" class="item">+ registrarOrden() / obtenerOrdenes() / buscarOrdenes()</text>
    <text x="12" y="210" class="item">+ modificarOrden(orden) / eliminarOrden(folio)</text>
  </g>

  <line class="linea-dep" x1="860" y1="510" x2="820" y2="510" marker-end="url(#flechaUso)"/>
  <line class="linea-dep" x1="1115" y1="415" x2="1115" y2="360" marker-end="url(#flechaUso)"/>

  <!-- APLICACION SGRT (GUI) -->
  <g transform="translate(120, 685)">
    <rect class="clase-gui" width="1160" height="295"/>
    <rect class="header-gui" width="1160" height="38" rx="4"/>
    <text x="580" y="16" class="estereotipo">&lt;&lt;interfaz.py — Hereda de tk.Tk&gt;&gt;</text>
    <text x="580" y="31" class="clase-nombre">AplicacionSGRT</text>
    <text x="16" y="60" class="item">- _gestorBd: GestorBaseDatos</text>
    <text x="16" y="78" class="item">- _mapaClientes: dict | _mapaTecnicos: dict</text>
    <text x="16" y="96" class="item">- _logoImagen: tk.PhotoImage (logo_sgrt.png)</text>
    <text x="520" y="60" class="item">- _tablaOrdenes / _tablaClientes / _tablaTecnicos: ttk.Treeview</text>
    <text x="520" y="78" class="item">- _cuaderno: ttk.Notebook (Órdenes, Clientes, Técnicos, Bitácora)</text>
    <text x="520" y="96" class="item">- _textoDetalleOrden / _textoBitacora: tk.Text</text>
    <line class="sep" x1="0" y1="110" x2="1160" y2="110"/>
    <text x="16" y="132" class="item">+ _configurarVentana() / _configurarEstilos() / _construirEncabezado() / _construirPestanas()</text>
    <text x="16" y="152" class="item">+ _registrarOrden() / _consultarOrdenes() / _modificarOrden() / _eliminarOrden()</text>
    <text x="16" y="172" class="item">+ _calcularTotalFormulario() / _construirOrdenDesdeFormulario() / _seleccionarOrdenTabla()</text>
    <text x="16" y="192" class="item">+ _registrarCliente() / _modificarCliente() / _eliminarCliente() / _cargarClientes()</text>
    <text x="16" y="212" class="item">+ _registrarTecnico() / _modificarTecnico() / _eliminarTecnico() / _cargarTecnicos()</text>
    <text x="16" y="232" class="item">+ _actualizarVistaBitacora() / _cargarTodo()</text>
    <text x="16" y="258" class="item">Validaciones GUI con messagebox: campos vacíos, texto por número, fuera de rango, duplicados e inexistentes.</text>
    <text x="16" y="278" class="item">Punto de entrada único: main.py -&gt; AplicacionSGRT().mainloop()</text>
  </g>

  <line class="linea-asoc" x1="1020" y1="685" x2="1020" y2="650" marker-start="url(#diamanteAgregacion)"/>
  <line class="linea-dep" x1="210" y1="685" x2="210" y2="585" marker-end="url(#flechaUso)"/>
</svg>
