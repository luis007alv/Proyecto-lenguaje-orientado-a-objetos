<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 1360 960">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .titulo { font-family: Arial, sans-serif; font-size: 19px; font-weight: bold; fill: #111827; }
      .subtitulo { font-family: Arial, sans-serif; font-size: 12px; fill: #4B5563; }
      .box { fill: #FFFFFF; stroke: #1F2937; stroke-width: 1.8; }
      .head { fill: #1F2937; }
      .head-gui { fill: #2563EB; }
      .head-exc { fill: #991B1B; }
      .cname { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .stereo { font-family: Arial, sans-serif; font-size: 10px; fill: #E5E7EB; text-anchor: middle; }
      .txt { font-family: Courier, monospace; font-size: 11px; fill: #111827; }
      .sep { stroke: #9CA3AF; stroke-width: 1; }
      .herencia { stroke: #111827; stroke-width: 1.6; fill: none; }
      .asoc { stroke: #374151; stroke-width: 1.5; fill: none; }
      .dep { stroke: #6B7280; stroke-width: 1.4; stroke-dasharray: 5,4; fill: none; }
    </style>
    <marker id="triangulo" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    </marker>
    <marker id="rombo" markerWidth="14" markerHeight="10" refX="0" refY="5" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="#111827" stroke="#111827" stroke-width="1.2"/>
    </marker>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,1 L10,5 L0,9" fill="none" stroke="#6B7280" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1360" height="960" class="bg"/>
  <text x="30" y="34" class="titulo">Diagrama de Clases UML Actualizado — Sistema de Gestión de Reparaciones Tecnológicas (SGRT)</text>
  <text x="30" y="54" class="subtitulo">Módulos: persona.py | dispositivo.py | orden_servicio.py | persistencia.py | excepciones.py | interfaz.py</text>

  <!-- PERSONA -->
  <rect x="140" y="80" width="260" height="145" class="box"/>
  <rect x="140" y="80" width="260" height="28" class="head"/>
  <text x="270" y="99" class="cname">Persona</text>
  <text x="150" y="124" class="txt">- _nombre: str</text>
  <text x="150" y="140" class="txt">- _telefono: str</text>
  <line x1="140" y1="150" x2="400" y2="150" class="sep"/>
  <text x="150" y="168" class="txt">+ nombre / telefono &lt;&lt;property&gt;&gt;</text>
  <text x="150" y="184" class="txt">+ toDict(): dict</text>
  <text x="150" y="200" class="txt">+ __str__(): str</text>

  <!-- CLIENTE -->
  <rect x="30" y="280" width="225" height="135" class="box"/>
  <rect x="30" y="280" width="225" height="28" class="head"/>
  <text x="142" y="299" class="cname">Cliente</text>
  <text x="40" y="324" class="txt">- _direccion: str</text>
  <line x1="30" y1="335" x2="255" y2="335" class="sep"/>
  <text x="40" y="353" class="txt">+ direccion &lt;&lt;property&gt;&gt;</text>
  <text x="40" y="369" class="txt">+ toDict(): dict</text>
  <text x="40" y="385" class="txt">+ __str__(): str (sobrescrito)</text>

  <!-- TECNICO -->
  <rect x="275" y="280" width="225" height="135" class="box"/>
  <rect x="275" y="280" width="225" height="28" class="head"/>
  <text x="387" y="299" class="cname">Tecnico</text>
  <text x="285" y="324" class="txt">- _especialidad: str</text>
  <line x1="275" y1="335" x2="500" y2="335" class="sep"/>
  <text x="285" y="353" class="txt">+ especialidad &lt;&lt;property&gt;&gt;</text>
  <text x="285" y="369" class="txt">+ toDict(): dict</text>
  <text x="285" y="385" class="txt">+ __str__(): str (sobrescrito)</text>

  <polyline points="142,280 142,252 270,252 270,225" class="herencia" marker-end="url(#triangulo)"/>
  <polyline points="387,280 387,252 270,252 270,225" class="herencia" marker-end="url(#triangulo)"/>

  <!-- DISPOSITIVO -->
  <rect x="615" y="80" width="275" height="160" class="box"/>
  <rect x="615" y="80" width="275" height="28" class="head"/>
  <text x="752" y="99" class="cname">Dispositivo</text>
  <text x="625" y="124" class="txt">- _marca: str</text>
  <text x="625" y="140" class="txt">- _modelo: str</text>
  <text x="625" y="156" class="txt">- _fallaReportada: str</text>
  <line x1="615" y1="166" x2="890" y2="166" class="sep"/>
  <text x="625" y="184" class="txt">+ marca/modelo/falla &lt;&lt;property&gt;&gt;</text>
  <text x="625" y="200" class="txt">+ toDict(): dict</text>
  <text x="625" y="216" class="txt">+ __str__(): str</text>

  <!-- COMPUTADORA -->
  <rect x="520" y="280" width="225" height="135" class="box"/>
  <rect x="520" y="280" width="225" height="28" class="head"/>
  <text x="632" y="299" class="cname">Computadora</text>
  <text x="530" y="324" class="txt">- _ram: int</text>
  <line x1="520" y1="335" x2="745" y2="335" class="sep"/>
  <text x="530" y="353" class="txt">+ ram &lt;&lt;property&gt;&gt;</text>
  <text x="530" y="369" class="txt">+ toDict(): dict</text>
  <text x="530" y="385" class="txt">+ __str__(): str (sobrescrito)</text>

  <!-- DISPOSITIVO MOVIL -->
  <rect x="765" y="280" width="235" height="135" class="box"/>
  <rect x="765" y="280" width="235" height="28" class="head"/>
  <text x="882" y="299" class="cname">DispositivoMovil</text>
  <text x="775" y="324" class="txt">- _imei: str</text>
  <line x1="765" y1="335" x2="1000" y2="335" class="sep"/>
  <text x="775" y="353" class="txt">+ imei &lt;&lt;property&gt;&gt;</text>
  <text x="775" y="369" class="txt">+ toDict(): dict</text>
  <text x="775" y="385" class="txt">+ __str__(): str (sobrescrito)</text>

  <polyline points="632,280 632,260 752,260 752,240" class="herencia" marker-end="url(#triangulo)"/>
  <polyline points="882,280 882,260 752,260 752,240" class="herencia" marker-end="url(#triangulo)"/>

  <!-- ORDEN DE SERVICIO -->
  <rect x="1025" y="80" width="305" height="335" class="box"/>
  <rect x="1025" y="80" width="305" height="28" class="head"/>
  <text x="1177" y="99" class="cname">OrdenServicio</text>
  <text x="1035" y="124" class="txt">- _folio: str</text>
  <text x="1035" y="140" class="txt">- _cliente: Cliente</text>
  <text x="1035" y="156" class="txt">- _tecnico: Tecnico</text>
  <text x="1035" y="172" class="txt">- _dispositivo: Dispositivo</text>
  <text x="1035" y="188" class="txt">- _costoComponentes: float</text>
  <text x="1035" y="204" class="txt">- _costoManoObra: float</text>
  <text x="1035" y="220" class="txt">- _costoTotal: float</text>
  <text x="1035" y="236" class="txt">- _estado: str</text>
  <line x1="1025" y1="246" x2="1330" y2="246" class="sep"/>
  <text x="1035" y="264" class="txt">+ costoTotal / estado &lt;&lt;property&gt;&gt;</text>
  <text x="1035" y="280" class="txt">+ calcularCosto(): float</text>
  <text x="1035" y="296" class="txt">+ cambiarEstado(nuevoEstado): void</text>
  <text x="1035" y="312" class="txt">+ generarResumen(): str</text>
  <text x="1035" y="328" class="txt">+ toDict(): dict</text>
  <text x="1035" y="344" class="txt">+ desdeDict(dato: dict): OrdenServicio</text>
  <text x="1035" y="360" class="txt">+ __str__(): str</text>

  <line x1="1025" y1="160" x2="890" y2="160" class="asoc" marker-start="url(#rombo)"/>
  <polyline points="1025,225 510,225 510,340 500,340" class="asoc" marker-start="url(#rombo)"/>

  <!-- GESTOR ARCHIVOS -->
  <rect x="30" y="470" width="380" height="135" class="box"/>
  <rect x="30" y="470" width="380" height="28" class="head"/>
  <text x="220" y="489" class="cname">GestorArchivos</text>
  <text x="40" y="514" class="txt">+ rutaDatos: Path (ordenes_datos.txt)</text>
  <line x1="30" y1="524" x2="410" y2="524" class="sep"/>
  <text x="40" y="542" class="txt">+ guardarOrdenes(listaOrdenes): void</text>
  <text x="40" y="558" class="txt">+ cargarOrdenes(): list[OrdenServicio]</text>
  <text x="40" y="574" class="txt">+ registrarError(mensaje): void (en persistencia.py)</text>

  <!-- GESTOR BASE DATOS -->
  <rect x="450" y="470" width="440" height="215" class="box"/>
  <rect x="450" y="470" width="440" height="28" class="head"/>
  <text x="670" y="489" class="cname">GestorBaseDatos</text>
  <text x="460" y="514" class="txt">- _rutaBd: Path (catalogos_sgrt.db)</text>
  <text x="460" y="530" class="txt">- _rutaTxt: Path (ordenes_datos.txt)</text>
  <line x1="450" y1="540" x2="890" y2="540" class="sep"/>
  <text x="460" y="558" class="txt">+ crearTablas() / cargarDatosIniciales()</text>
  <text x="460" y="574" class="txt">+ registrarCliente() / obtenerClientes() / modificar / eliminar</text>
  <text x="460" y="590" class="txt">+ registrarTecnico() / obtenerTecnicos() / modificar / eliminar</text>
  <text x="460" y="606" class="txt">+ registrarOrden() / obtenerOrdenes() / buscarOrdenes()</text>
  <text x="460" y="622" class="txt">+ modificarOrden() / eliminarOrden()</text>

  <line x1="450" y1="545" x2="410" y2="545" class="dep" marker-end="url(#flecha)"/>
  <polyline points="890,515 1177,515 1177,415" class="dep" marker-end="url(#flecha)"/>

  <!-- EXCEPCIONES -->
  <rect x="930" y="470" width="400" height="145" class="box"/>
  <rect x="930" y="470" width="400" height="36" class="head-exc"/>
  <text x="1130" y="485" class="stereo">&lt;&lt;excepciones&gt;&gt;</text>
  <text x="1130" y="500" class="cname">Excepciones Personalizadas</text>
  <text x="940" y="526" class="txt">+ ValorFueraDeRangoError(ValueError)</text>
  <text x="940" y="544" class="txt">+ RegistroDuplicadoError(ValueError)</text>
  <text x="940" y="562" class="txt">+ RegistroNoEncontradoError(LookupError)</text>
  <line x1="930" y1="572" x2="1330" y2="572" class="sep"/>
  <text x="940" y="590" class="txt">Capturadas en GUI con messagebox y log_errores.txt</text>

  <!-- INTERFAZ TALLER -->
  <rect x="180" y="720" width="1000" height="210" class="box"/>
  <rect x="180" y="720" width="1000" height="36" class="head-gui"/>
  <text x="680" y="735" class="stereo">&lt;&lt;GUI - tk.Tk&gt;&gt;</text>
  <text x="680" y="750" class="cname">InterfazTaller</text>
  <text x="195" y="776" class="txt">- _gestorBd: GestorBaseDatos    - _mapaClientes: dict    - _mapaTecnicos: dict    - _imagenLogo: tk.PhotoImage</text>
  <text x="195" y="792" class="txt">- _treeOrdenes / _treeClientes / _treeTecnicos: ttk.Treeview    - _txtResumen / _txtLog: tk.Text</text>
  <line x1="180" y1="802" x2="1180" y2="802" class="sep"/>
  <text x="195" y="820" class="txt">+ _crearEncabezado() / _crearPestanas() / _armarTabOrdenes() / _armarTabClientes() / _armarTabTecnicos() / _armarTabLog()</text>
  <text x="195" y="836" class="txt">+ _calcularCostoVista() / _verTicketOrden() / _registrarOrden() / _buscarOrdenes() / _modificarOrden() / _eliminarOrden()</text>
  <text x="195" y="852" class="txt">+ _registrarCliente() / _modificarCliente() / _eliminarCliente() / _registrarTecnico() / _modificarTecnico() / _eliminarTecnico()</text>
  <text x="195" y="868" class="txt">+ _cargarLog() / _refrescarTodo()</text>

  <line x1="670" y1="720" x2="670" y2="685" class="asoc" marker-start="url(#rombo)"/>
  <polyline points="1130,720 1130,615" class="dep" marker-end="url(#flecha)"/>
</svg>